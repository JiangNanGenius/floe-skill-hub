name: transport-mirror-maintenance
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# Advisory health and unsigned renewal proposal only. No signing secret,
# repository write, approval, merge, dispatch or production publication.
permissions:
  contents: read
concurrency:
  group: transport-mirror-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install fixed public verification library
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.6
      - name: Verify signed list, probe approved roles and prepare renewal when due
        run: |
          set -euo pipefail
          publication="$(git rev-parse HEAD)"
          python3 scripts/transport_manifest.py maintenance \
            --root "$GITHUB_WORKSPACE" \
            --publication-commit "$publication" \
            --out "$RUNNER_TEMP/transport-maintenance"
      - name: Retain health evidence and unsigned proposal
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: transport-mirror-maintenance
          path: ${{ runner.temp }}/transport-maintenance
          if-no-files-found: warn
          retention-days: 7
