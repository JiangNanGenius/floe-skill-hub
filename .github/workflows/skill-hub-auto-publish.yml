            local line live
            line=$(git ls-remote "$1" "refs/heads/main")
            if [ "$(printf '%s\n' "$line" | grep -c '')" != "1" ]; then
              echo "official main resolution is not exactly one line" >&2
              return 2
            fi
            live=$(printf '%s' "$line" | cut -f1)
