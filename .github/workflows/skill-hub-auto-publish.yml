          git show refs/floe/auto-state:candidate-manifest.json > "$RUNNER_TEMP/candidate-manifest.json"
          git show refs/floe/auto-state:state.json > "$RUNNER_TEMP/state.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/state.json"
          OPEN=$(python3 -c 'import json,sys,pathlib; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["requestId"])' "$RUNNER_TEMP/request.json")
          X=$(python3 -c 'import json,sys,pathlib; d=json.loads(pathlib.Path(sys.argv[1]).read_bytes()); print(d["sourceCommit"]); assert d["mode"]=="catalog"' "$RUNNER_TEMP/request.json")
          echo "X_SHA=$X" >> "$GITHUB_ENV"
          LIVE=$(resolve_live_main "$HUB_ORIGIN")
          set +e
          python3 - "$RUNNER_TEMP/request.json" "$REQ_ID" "$OPEN" "$X" \
            "$(git rev-parse refs/floe/candidate-tip)" "$LIVE" <<'PY'
          import json, pathlib, sys
          request = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          rid, open_id, source, tip, live = sys.argv[2:7]
          reasons = []
          if request["requestId"] != rid or open_id != rid:
              reasons.append("open request changed since routing")
          if tip != source:
              reasons.append("the tip already moved past X; recovery owns this")
          if request["basePublication"] != live:
              reasons.append("live main moved away from the request base")
          if reasons:
              print("; ".join(reasons))
              sys.exit(140)
          PY
          RC=$?
          set -e
          if [ "$RC" = "140" ]; then
            echo "the publication advance classification no longer applies; bounded no-write exit, the next poll re-evaluates"
            echo "proceed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$RC" = "0" ] || { echo "revalidation failed rc=$RC" >&2; exit "$RC"; }
          echo "proceed=1" >> "$GITHUB_OUTPUT"
          echo "LIVE_BASE=$LIVE" >> "$GITHUB_ENV"

      - name: Re-derive the candidate + deterministic feed rebuild
        id: recompute
        if: steps.precheck.outputs.proceed == '1'
        run: |
          set -euo pipefail
          TODAY=$(python3 -c 'import json,sys,pathlib; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["stageToday"])' "$RUNNER_TEMP/candidate-manifest.json")
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          git worktree add --detach -q "$RUNNER_TEMP/base-wt" "$LIVE_BASE"
          python3 "$RUNNER_TEMP/base-wt/scripts/automatic_publication.py" rederive-candidate \
            --repo-root "$RUNNER_TEMP/base-wt" --base-commit "$LIVE_BASE" \
            --candidate-commit "$X_SHA" --today "$TODAY" \
            --stage-root "$RUNNER_TEMP/fresh-stage"
          git worktree add --detach -q "$RUNNER_TEMP/x-wt" "$X_SHA"
          python3 scripts/automatic_publication.py rebuild-feeds \
            --x-root "$RUNNER_TEMP/x-wt" --source-commit "$X_SHA" \
            --out "$RUNNER_TEMP/feeds"

      - name: Verify candidate X + relay (official signatures, receipt digests, freezes)
        if: steps.precheck.outputs.proceed == '1'
        run: |
          set -euo pipefail
          python3 scripts/automatic_publication.py verify-candidate \
            --repo-root . --request-file "$RUNNER_TEMP/request.json" \
            --manifest-file "$RUNNER_TEMP/candidate-manifest.json" \
            --stage-root "$RUNNER_TEMP/fresh-stage" --expected-base "$LIVE_BASE"
          python3 scripts/automatic_publication.py relay-verify \
            --repo-root . --request-file "$RUNNER_TEMP/request.json" \
            --relay-dir "$RUNNER_TEMP/relay" --candidate-commit "$X_SHA" \
            --feeds-dir "$RUNNER_TEMP/feeds"
          python3 scripts/automatic_publication.py build-y \
            --repo-root . --request-file "$RUNNER_TEMP/request.json" \
            --relay-dir "$RUNNER_TEMP/relay" --feeds-dir "$RUNNER_TEMP/feeds" \
            --out "$RUNNER_TEMP/y-payload"

      - name: Commit Y then H (append-only ledger rows derived from Y)
        id: commits
        if: steps.precheck.outputs.proceed == '1'
        run: |
          set -euo pipefail
          git config user.name "floe-skill-hub-automation"
          git config user.email "automation@users.noreply.github.com"
          git worktree add --detach -q "$RUNNER_TEMP/pub-wt" "$X_SHA"
          python3 scripts/automatic_publication.py apply-payload \
            --payload-dir "$RUNNER_TEMP/y-payload" --repo-root "$RUNNER_TEMP/pub-wt"
          git -C "$RUNNER_TEMP/pub-wt" add -A
          git -C "$RUNNER_TEMP/pub-wt" commit -q -m "auto-publish: Y for request ${REQ_ID}"
          Y=$(git -C "$RUNNER_TEMP/pub-wt" rev-parse HEAD)
          echo "y=$Y" >> "$GITHUB_OUTPUT"
          python3 - . "$X_SHA" "$Y" <<'PY'
          import subprocess, sys
          root, x, y = sys.argv[1:4]
          sys.path.insert(0, "scripts")
          import automatic_publication as ap
          raw = subprocess.run(["git", "-C", root, "diff", "--name-status", "-z", x, y],
                               capture_output=True, check=True).stdout
          fields = [f for f in raw.split(b"\0") if f]
          index = 0
          while index < len(fields):
              status = fields[index].decode()
              rel = fields[index + 1].decode()
              index += 2
              if status[0] in ("R", "C", "D"):
                  raise SystemExit(f"Y may not rename/copy/delete: {rel}")
              ok = (rel in ap.PUBLISH_ALLOW_EXACT
                    or any(rel.startswith(p) for p in ap.PUBLISH_ALLOW_DIRS))
              if not ok:
                  raise SystemExit(f"Y changes a path outside the publication allowlist: {rel}")
          PY
          python3 scripts/automatic_publication.py build-h \
            --repo-root . --base-commit "$LIVE_BASE" --y-commit "$Y" \
            --out "$RUNNER_TEMP/h-payload"
          python3 scripts/automatic_publication.py apply-payload \
            --payload-dir "$RUNNER_TEMP/h-payload" --repo-root "$RUNNER_TEMP/pub-wt"
          git -C "$RUNNER_TEMP/pub-wt" add -A
          git -C "$RUNNER_TEMP/pub-wt" commit -q -m "auto-publish: H ledger append for ${REQ_ID}"
          H=$(git -C "$RUNNER_TEMP/pub-wt" rev-parse HEAD)
          echo "h=$H" >> "$GITHUB_OUTPUT"
          python3 scripts/automatic_publication.py check-chain \
            --repo-root . --base-commit "$LIVE_BASE" --x-commit "$X_SHA" \
            --y-commit "$Y" --h-commit "$H"

      - name: Push H on the candidate ref (main untouched; a crash here recovers via the tip proof)
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' \
            -c gc.auto=0 push "$HUB_ORIGIN" "${{ steps.commits.outputs.h }}:refs/heads/${STAGING_REF}"

      - name: Exact CAS advance of main B -> H (beforeOid re-resolved, force=false)
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/automatic_publication.py cas \
            --base-commit "$LIVE_BASE" --head-commit "${{ steps.commits.outputs.h }}" \
            --token-env GITHUB_TOKEN

      - name: Verify the actual public bytes and history directly
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          python3 scripts/automatic_publication.py verify-public \
            --repo-root . --head-commit "${{ steps.commits.outputs.h }}" \
            --x-commit "$X_SHA" --base-commit "$LIVE_BASE"

      - name: Close the request on auto-state (processed, bounded, idempotent)
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c gc.auto=0 fetch --no-tags "$HUB_ORIGIN" \
            +refs/heads/auto-state:refs/floe/auto-state
          CTRL="$RUNNER_TEMP/close-wt"
          rm -rf "$CTRL"
          git worktree add --detach -q "$CTRL" refs/floe/auto-state
          NOW_OPEN=$(python3 -c 'import json,sys,pathlib
          p = pathlib.Path(sys.argv[1])
          print(json.loads(p.read_bytes())["requestId"] if p.is_file() else "")' "$CTRL/request.json")
          if [ -n "$NOW_OPEN" ] && [ "$NOW_OPEN" != "$REQ_ID" ]; then
            echo "open request changed mid-flight; refusing to close another pipeline's request" >&2
            exit 2
          fi
          echo '{}' > "$RUNNER_TEMP/close-state.json"
          if [ -f "$CTRL/state.json" ]; then
            cp "$CTRL/state.json" "$RUNNER_TEMP/close-state.json"
          fi
          printf '{"pipelineStage":"published","lastPublicationY":"%s","lastPublicationH":"%s"}' \
            "${{ steps.commits.outputs.y }}" "${{ steps.commits.outputs.h }}" \
            > "$RUNNER_TEMP/extra.json"
          python3 scripts/automatic_publication.py mark-processed \
            --state-file "$RUNNER_TEMP/close-state.json" \
            --request-file "$RUNNER_TEMP/request.json" \
            --extra-file "$RUNNER_TEMP/extra.json" \
            --out "$RUNNER_TEMP/new-state.json"
          cp "$RUNNER_TEMP/new-state.json" "$CTRL/state.json"
          rm -f "$CTRL/request.json" "$CTRL/candidate-manifest.json"
          mkdir -p "$CTRL/requests/$REQ_ID"
          cp "$RUNNER_TEMP/request.json" "$CTRL/requests/$REQ_ID/request.json"
          cp "$RUNNER_TEMP/candidate-manifest.json" "$CTRL/requests/$REQ_ID/candidate-manifest.json"
          python3 scripts/automatic_publication.py prune-requests \
            --requests-dir "$CTRL/requests" --state-file "$CTRL/state.json"
          git -C "$CTRL" add -A
          python3 - "$CTRL" <<'PY'
          import subprocess, sys
          ctrl = sys.argv[1]
          allowed = ("state.json", "request.json", "candidate-manifest.json")
          listed = subprocess.run(["git", "-C", ctrl, "ls-files", "-s", "-z"],
                                  capture_output=True, check=True).stdout
          for entry in [e for e in listed.split(b"\0") if e]:
              meta, name = entry.split(b"\t", 1)
              mode, rel = meta.split()[0].decode(), name.decode()
              parts = rel.split("/")
              if rel in allowed:
                  pass
              elif (len(parts) == 3 and parts[0] == "requests"
                    and len(parts[1]) == 64
                    and all(c in "0123456789abcdef" for c in parts[1])
                    and parts[2] in ("request.json", "candidate-manifest.json")):
                  pass
              else:
                  raise SystemExit(f"control branch path is outside the allowlist: {rel}")
              if mode != "100644":
                  raise SystemExit(f"control branch carries a non-blob mode: {mode} {rel}")
          PY
          if git -C "$CTRL" diff --cached --quiet; then
            exit 0
          fi
          git -C "$CTRL" -c user.name="floe-skill-hub-automation" \
            -c user.email="automation@users.noreply.github.com" \
            commit -q -m "auto-control: published + closed request ${REQ_ID}"
          CLOSE_SHA=$(git -C "$CTRL" rev-parse HEAD)
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' \
            -c gc.auto=0 push "$HUB_ORIGIN" "$CLOSE_SHA:refs/heads/auto-state"

  recover-publish:
    needs: verify
    if: >-
      vars.FLOE_SKILL_HUB_AUTO_UPDATES == 'enabled' &&
      (needs.verify.outputs.action == 'recover-cas' ||
       needs.verify.outputs.action == 'recover-close')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write   # only refs/heads/auto-state; main advances ONLY via cas
    env:
      STAGING_REF: ${{ needs.verify.outputs.stagingRef }}
      REQ_ID: ${{ needs.verify.outputs.requestId }}
      SOURCE_SHA: ${{ needs.verify.outputs.sourceCommit }}
      BASE_SHA: ${{ needs.verify.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the pinned verification library
        run: python3 -m pip install --disable-pip-version-check "$CRYPTOGRAPHY_PIN"

      - name: Re-validate the recovery branch from freshly resolved public refs
        id: precheck
        run: |
          set -euo pipefail
          resolve_live_main() {
            local line live
            line=$(git ls-remote "$1" "refs/heads/main")
            if [ "$(printf '%s\n' "$line" | grep -c '')" != "1" ]; then
              echo "official main resolution is not exactly one line" >&2
              return 2
            fi
            live=$(printf '%s' "$line" | cut -f1)
            if ! printf '%s' "$live" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "official main resolution is not a 40-hex commit" >&2
              return 2
            fi
            printf '%s' "$live"
          }
          git -c gc.auto=0 fetch --no-tags "$HUB_ORIGIN" \
            +refs/heads/auto-state:refs/floe/auto-state
          git -c gc.auto=0 fetch --no-tags "$HUB_ORIGIN" \
            "+refs/heads/${STAGING_REF}:refs/floe/candidate-tip"
          git -c gc.auto=0 fetch --no-tags "$APP_ORIGIN" \
            +refs/heads/skill-hub-signing-relay:refs/floe/app-relay
          git worktree add --detach -q "$RUNNER_TEMP/relay" refs/floe/app-relay
          git show refs/floe/auto-state:request.json > "$RUNNER_TEMP/request.json"
          git show refs/floe/auto-state:candidate-manifest.json > "$RUNNER_TEMP/candidate-manifest.json"
          git show refs/floe/auto-state:state.json > "$RUNNER_TEMP/state.json" 2>/dev/null \
            || echo '{}' > "$RUNNER_TEMP/state.json"
          TIP=$(git rev-parse refs/floe/candidate-tip)
          LIVE=$(resolve_live_main "$HUB_ORIGIN")
          BRANCH=$(python3 - "$RUNNER_TEMP/request.json" "$REQ_ID" "$SOURCE_SHA" "$LIVE" "$TIP" <<'PY'
          import json, pathlib, sys
          request = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          rid, source, live, tip = sys.argv[2:6]
          if (request["requestId"] != rid or request["sourceCommit"] != source
                  or request["mode"] != "catalog" or tip == source):
              print("none")
          elif live == request["basePublication"]:
              print("cas")
          elif live == tip:
              print("close")
          else:
              print("none")
          PY
          )
          if [ "$BRANCH" = "none" ]; then
            echo "this run's recovery classification no longer applies; exiting without any write"
            echo "RECOVER_BRANCH=none" >> "$GITHUB_ENV"
            echo "proceed=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "RECOVER_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          echo "proceed=1" >> "$GITHUB_OUTPUT"
          echo "TIP_SHA=$TIP" >> "$GITHUB_ENV"
          echo "LIVE_BASE=$LIVE" >> "$GITHUB_ENV"
          # the chain to prove is B -> X -> Y -> H with B = the request's own
          # base; on the close branch live already equals H, never B
          echo "REQ_BASE=$(python3 -c 'import json,sys,pathlib; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["basePublication"])' "$RUNNER_TEMP/request.json")" >> "$GITHUB_ENV"

      - name: Re-derive the candidate's immutable NEW selections over the request base
        id: recompute
        if: steps.precheck.outputs.proceed == '1'
        run: |
          set -euo pipefail
          TODAY=$(python3 -c 'import json,sys,pathlib; print(json.loads(pathlib.Path(sys.argv[1]).read_bytes())["stageToday"])' "$RUNNER_TEMP/candidate-manifest.json")
          echo "today=$TODAY" >> "$GITHUB_OUTPUT"
          git worktree add --detach -q "$RUNNER_TEMP/base-wt" "$LIVE_BASE"
          # both branches re-derive over the request's own X with the request
          # base (REQ_BASE), never over the live H on the close branch: the
          # published H is the proof SUBJECT, not the derivation base. The OLD
          # -> NEW selections come from the candidate's committed registry diff
          # (rederive-candidate), not from live upstream HEADs.
          python3 "$RUNNER_TEMP/base-wt/scripts/automatic_publication.py" rederive-candidate \
            --repo-root "$RUNNER_TEMP/base-wt" --base-commit "$REQ_BASE" \
            --candidate-commit "$SOURCE_SHA" --today "$TODAY" \
            --stage-root "$RUNNER_TEMP/fresh-stage"

      - name: Prove the original X->Y->H chain for the tip (core recover proof, never re-signed)
        if: steps.precheck.outputs.proceed == '1'
        run: |
          set -euo pipefail
          # ACTUAL final core API (REDERIVE-RECOVERY-API.json apiVersion 2):
          # recover resolves the ORIGINAL Y as the tip's single parent and X
          # as Y's parent (which must equal the request sourceCommit), then
          # runs the ONE centralized published-chain proof over the ORIGINAL
          # commits: structural chain diffs + allow/deny + engine/history
          # freezes, explicit append-only ledger prefix retention and the
          # exact expected ledger bytes over the ORIGINAL Y, the catalog
          # relay receipt over locally rebuilt feed bytes byte-equal to the
          # committed Y feeds on both channels, and the FULL candidate
          # verification over the committed X from the fresh stage. Freshly
          # rebuilt timestamped commits are never compared. A forged/tampered
          # tip, a broken chain, a ledger prefix violation or a missing proof
          # input fails closed with exit 2; the recovered action must still
          # equal this run's freshly re-validated branch classification.
          git worktree add --detach -q "$RUNNER_TEMP/x-wt" "$SOURCE_SHA"
          python3 "$RUNNER_TEMP/base-wt/scripts/automatic_publication.py" recover \
            --repo-root "$RUNNER_TEMP/base-wt" \
            --request-file "$RUNNER_TEMP/request.json" \
            --manifest-file "$RUNNER_TEMP/candidate-manifest.json" \
            --live-main "$LIVE_BASE" --candidate-tip "$TIP_SHA" \
            --stage-root "$RUNNER_TEMP/fresh-stage" \
            --relay-dir "$RUNNER_TEMP/relay" \
            --x-root "$RUNNER_TEMP/x-wt" \
            > "$RUNNER_TEMP/recover-plan.json"
          cat "$RUNNER_TEMP/recover-plan.json"
          python3 - "$RUNNER_TEMP/recover-plan.json" "$TIP_SHA" "$SOURCE_SHA" "$REQ_BASE" "$RECOVER_BRANCH" <<'PY'
          import json, pathlib, sys
          plan = json.loads(pathlib.Path(sys.argv[1]).read_bytes())
          tip, source, base, branch = sys.argv[2:6]
          want = {"cas": "cas-existing-h", "close": "close-published"}[branch]
          if plan.get("action") != want:
              raise SystemExit(f"core recover no longer classifies this re-validated branch: got {plan.get('action')!r}, want {want!r}")
          if plan.get("h") != tip or plan.get("x") != source:
              raise SystemExit("core recover proved a different chain than the re-validated candidate tip")
          if branch == "cas" and plan.get("base") != base:
              raise SystemExit("core recover CAS base drifted from the request base")
          proof = plan.get("proofStatus") or {}
          if (proof.get("chain") != "publication-diffs-ok"
                  or proof.get("relay") != "relay-ok"
                  or proof.get("candidate") != "candidate-ok"):
              raise SystemExit(f"full chain/relay/candidate proof incomplete: {proof}")
          PY

      - name: Retry the exact CAS on the SAME original H (no re-signing, no rebuilt history)
        if: steps.precheck.outputs.proceed == '1' && env.RECOVER_BRANCH == 'cas' && github.event.inputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 scripts/automatic_publication.py cas \
            --base-commit "$REQ_BASE" --head-commit "$TIP_SHA" \
            --token-env GITHUB_TOKEN

      - name: Verify the actual public bytes and history directly
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # for the cas branch: the tip was just CAS-published from the exact
          # base; for the close branch: live main already equals the tip (the
          # crash happened after a successful CAS, before the control close).
          # --base-commit makes the public readback prove the append-only
          # ledger prefix over the committed base ledger as well.
          python3 scripts/automatic_publication.py verify-public \
            --repo-root . --head-commit "$TIP_SHA" --x-commit "$SOURCE_SHA" \
            --base-commit "$REQ_BASE"

      - name: Close the request on auto-state (this crash point is recovered here)
        if: steps.precheck.outputs.proceed == '1' && github.event.inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c gc.auto=0 fetch --no-tags "$HUB_ORIGIN" \
            +refs/heads/auto-state:refs/floe/auto-state
          CTRL="$RUNNER_TEMP/close-wt"
          rm -rf "$CTRL"
          git worktree add --detach -q "$CTRL" refs/floe/auto-state
          NOW_OPEN=$(python3 -c 'import json,sys,pathlib
          p = pathlib.Path(sys.argv[1])
          print(json.loads(p.read_bytes())["requestId"] if p.is_file() else "")' "$CTRL/request.json")
          if [ -n "$NOW_OPEN" ] && [ "$NOW_OPEN" != "$REQ_ID" ]; then
            echo "open request changed mid-flight; refusing to close another pipeline's request" >&2
            exit 2
          fi
          echo '{}' > "$RUNNER_TEMP/close-state.json"
          if [ -f "$CTRL/state.json" ]; then
            cp "$CTRL/state.json" "$RUNNER_TEMP/close-state.json"
          fi
          printf '{"pipelineStage":"published","lastPublicationH":"%s","recovered":"1"}' \
            "$TIP_SHA" > "$RUNNER_TEMP/extra.json"
          python3 scripts/automatic_publication.py mark-processed \
            --state-file "$RUNNER_TEMP/close-state.json" \
            --request-file "$RUNNER_TEMP/request.json" \
            --extra-file "$RUNNER_TEMP/extra.json" \
            --out "$RUNNER_TEMP/new-state.json"
          cp "$RUNNER_TEMP/new-state.json" "$CTRL/state.json"
          rm -f "$CTRL/request.json" "$CTRL/candidate-manifest.json"
          mkdir -p "$CTRL/requests/$REQ_ID"
          cp "$RUNNER_TEMP/request.json" "$CTRL/requests/$REQ_ID/request.json"
          cp "$RUNNER_TEMP/candidate-manifest.json" "$CTRL/requests/$REQ_ID/candidate-manifest.json"
          python3 scripts/automatic_publication.py prune-requests \
            --requests-dir "$CTRL/requests" --state-file "$CTRL/state.json"
          git -C "$CTRL" add -A
          python3 - "$CTRL" <<'PY'
          import subprocess, sys
          ctrl = sys.argv[1]
          allowed = ("state.json", "request.json", "candidate-manifest.json")
          listed = subprocess.run(["git", "-C", ctrl, "ls-files", "-s", "-z"],
                                  capture_output=True, check=True).stdout
          for entry in [e for e in listed.split(b"\0") if e]:
              meta, name = entry.split(b"\t", 1)
              mode, rel = meta.split()[0].decode(), name.decode()
              parts = rel.split("/")
              if rel in allowed:
                  pass
              elif (len(parts) == 3 and parts[0] == "requests"
                    and len(parts[1]) == 64
                    and all(c in "0123456789abcdef" for c in parts[1])
                    and parts[2] in ("request.json", "candidate-manifest.json")):
                  pass
              else:
                  raise SystemExit(f"control branch path is outside the allowlist: {rel}")
              if mode != "100644":
                  raise SystemExit(f"control branch carries a non-blob mode: {mode} {rel}")
          PY
          if git -C "$CTRL" diff --cached --quiet; then
            exit 0
          fi
          git -C "$CTRL" -c user.name="floe-skill-hub-automation" \
            -c user.email="automation@users.noreply.github.com" \
            commit -q -m "auto-control: recovered publish + closed request ${REQ_ID}"
          CLOSE_SHA=$(git -C "$CTRL" rev-parse HEAD)
          git -c credential.helper='!f() { echo "username=x-access-token"; echo "password=${GH_TOKEN}"; }; f' \
            -c gc.auto=0 push "$HUB_ORIGIN" "$CLOSE_SHA:refs/heads/auto-state"
