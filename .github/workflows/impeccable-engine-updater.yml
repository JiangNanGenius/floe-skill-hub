# Daily checks and candidate builds run independently of publication.
# Draft PR creation is DISABLED unless FLOE_IMPECCABLE_UPDATE_PRS=enabled and
# the owner-managed repository setting allows Actions to create pull requests.
# No automatic approval, merge, signing, publication or client installation.
#
# Content: identical to the reviewed template under
# `engines/impeccable/workflows/impeccable-engine-updater.yml` (same pinned
# action SHAs, same gates, same draft-PR-only posture). Keep the two files in
# sync deliberately; the template under engines/impeccable/workflows/ is the
# edit point for future fixes, this root copy is the install artifact.
#
# What it does: once a day (and on demand) it compares the upstream Impeccable
# engine release with the pin in `engines/impeccable/ENGINE-LOCK.json`. When a
# strictly newer stable engine release exists, it rebuilds the engine from
# that candidate commit inside a staged temp engine tree (the tracked lock,
# contract and binary stay untouched), runs the adapter suite, the contract
# gate, the behaviour matrix on the host and on riscv64, and the Needs/facts
# fixpoint regression, regenerates the derived skill source with the public
# stage 1 normalizer against an explicitly staged candidate lock, then opens
# a **draft update PR**. Nothing is published, signed, merged or installed.
#
# Update policy (automatic path): only non-draft, non-prerelease
# `engine-v<semver>` release tags are considered, the tag must agree with the
# `ENGINE_VERSION` in its own tree, and `changed` is true only for a strictly
# newer semantic engine version than the pin. A same-version release tag
# retargeted at a different commit (or an older version) is reported as
# unchanged with the reason recorded in the step summary: the pin is retained
# and nothing is rebuilt. A manually dispatched ref may stage an intentional
# different-commit/same-version candidate for review only (`manual-review`),
# never an automatic install.
#
# Deliberate limits:
#   * no signing secrets and no release credentials: only the default
#     `GITHUB_TOKEN`; the pin/build jobs are `contents: read`, and only the PR
#     job gets `contents`/`pull-requests` write, never approval or merge;
#   * the binary is uploaded as a workflow artifact for reviewers, never
#     committed and never attached to a release — packaging and publication stay
#     with the release owner;
#   * a failing gate leaves the current pin untouched: the PR is opened only
#     after every gate passed, and an existing installed engine is never
#     replaced automatically;
#   * it follows upstream **stable release tags** (`engine-v*`), never upstream
#     `main`, never drafts or prereleases, and never proposes a same-version or
#     downgrade update automatically;
#   * the tracked `ENGINE-LOCK.json`, the frozen contract, the frozen binary
#     and `sources/impeccable` are never modified by the workflow: the candidate
#     builds from a staged temp engine tree carrying the candidate lock, and
#     real compile/audit steps run with `--allow-network` on the fresh runner
#     (the no-TLS/no-crypto dependency audit always runs).
#
# Input and supply-chain handling (post-review hardening):
#   * every upstream-controlled value (`ENGINE_VERSION`, resolved commits,
#     candidate tags, the dispatch `upstream_ref`) is shape-validated in
#     `tools/resolve_upstream_pin.py` before emission, re-checked at the
#     `$GITHUB_OUTPUT` boundary, and re-asserted in each consuming step;
#   * workflow step outputs are passed to `run:` blocks only through `env:`
#     mappings and quoted `"$VARS"` argv — never as `${{ … }}` expressions
#     inside shell text;
#   * third-party actions are pinned to full commit SHAs (verified against the
#     action repositories' own refs; see `engines/impeccable/workflows/README.md`),
#     not floating major tags.
#
# Repository defaults remain read-only. This file keeps top-level
# `contents: read` and grants write only to the draft-PR job. It never changes
# account or repository permissions, approves a PR, or merges an update.

name: impeccable-engine-updater

on:
  schedule:
    # 06:10 UTC daily, offset from the other hub jobs
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Candidate upstream commit or engine-v* tag (empty = latest release tag)"
        required: false
        default: ""
      open_pr:
        description: "Open the update PR when every gate passes"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  # Least privilege: everything reads by default; only the PR job gets the
  # write scopes, on the default token only. The repository default workflow
  # permission stays `read`. Automatic draft PR creation also requires the
  # owner-approved combined create/approve repository switch; while it is
  # disabled, checks/builds can run but the PR job cannot create a PR. This
  # workflow never changes that setting, approves, merges or publishes.
  contents: read

concurrency:
  group: impeccable-engine-updater
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.1"
  RUST_TARGET: riscv64gc-unknown-linux-musl
  ZIG_VERSION: "0.17.0"
  ENGINE_DIR: engines/impeccable
  SOURCE_DIR: sources/impeccable

jobs:
  pin:
    name: Compare the pin with the upstream engine release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision_mode: ${{ steps.compare.outputs.decision_mode }}
      decision_reason: ${{ steps.compare.outputs.decision_reason }}
      current_commit: ${{ steps.compare.outputs.current_commit }}
      current_engine_version: ${{ steps.compare.outputs.current_engine_version }}
      candidate_commit: ${{ steps.compare.outputs.candidate_commit }}
      candidate_tree: ${{ steps.compare.outputs.candidate_tree }}
      candidate_engine_version: ${{ steps.compare.outputs.candidate_engine_version }}
      candidate_tag: ${{ steps.compare.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - id: compare
        name: Resolve the candidate and compare it with ENGINE-LOCK.json
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/workflows/tools/resolve_upstream_pin.py" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --upstream-repo pbakaus/impeccable \
            --requested-ref "${UPSTREAM_REF:-}" \
            --out "$RUNNER_TEMP/pin.json"
          cat "$RUNNER_TEMP/pin.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          pin = json.load(open(os.environ["RUNNER_TEMP"] + "/pin.json"))
          # Defense in depth: resolve_upstream_pin.py already shape-checked
          # these, but nothing unvalidated may cross the $GITHUB_OUTPUT
          # boundary. changed is coerced to the literal true/false below.
          SHAPES = {
              "current_commit": r"[0-9a-f]{40}",
              "candidate_commit": r"[0-9a-f]{40}",
              "candidate_tree": r"[0-9a-f]{40}",
              "current_engine_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "candidate_engine_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "candidate_tag": r"engine-v[0-9]+\.[0-9]+\.[0-9]+",
              "decision_mode": r"automatic|manual-review|no-op",
              # single-line printable ASCII, bounded length: safe in a
              # summary line and in the PR body.
              "decision_reason": r"[ -~]{1,240}",
          }
          for key, shape in SHAPES.items():
              value = pin.get(key)
              if not isinstance(value, str) or not re.fullmatch(shape, value):
                  sys.exit(f"refusing to emit output {key!r}: {value!r} does not match {shape}")
          print(f"changed={str(pin['changed']).lower()}")
          for key in SHAPES:
              print(f"{key}={pin[key]}")
          PY

      - name: Record the decision
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          DECISION_MODE: ${{ steps.compare.outputs.decision_mode }}
          DECISION_REASON: ${{ steps.compare.outputs.decision_reason }}
          CURRENT_VERSION: ${{ steps.compare.outputs.current_engine_version }}
          CURRENT_COMMIT: ${{ steps.compare.outputs.current_commit }}
          CANDIDATE_VERSION: ${{ steps.compare.outputs.candidate_engine_version }}
          CANDIDATE_COMMIT: ${{ steps.compare.outputs.candidate_commit }}
          CANDIDATE_TAG: ${{ steps.compare.outputs.candidate_tag }}
        run: |
          {
            echo "### Impeccable engine pin check"
            echo ""
            echo "- current: \`$CURRENT_VERSION\` @ \`$CURRENT_COMMIT\`"
            echo "- candidate: \`$CANDIDATE_VERSION\` @ \`$CANDIDATE_COMMIT\` (tag \`$CANDIDATE_TAG\`)"
            echo "- changed: \`$CHANGED\`"
            echo "- decision: \`$DECISION_MODE\` — $DECISION_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-verify:
    name: Build and verify the candidate engine
    needs: pin
    if: needs.pin.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - name: Install the pinned Rust toolchain and target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install the pinned zig cross toolchain
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zigenv"
          "$RUNNER_TEMP/zigenv/bin/pip" install --quiet "ziglang==$ZIG_VERSION"
          "$RUNNER_TEMP/zigenv/bin/python" -m ziglang version

      - name: Register a riscv64 binfmt handler (emulated behaviour matrix)
        run: docker run --privileged --rm tonistiigi/binfmt --install riscv64

      - name: Fetch the pinned upstream source at the candidate commit
        env:
          CANDIDATE: ${{ needs.pin.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          # Re-assert the shape here; the value is data, never script text.
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout "$CANDIDATE"
          git -C "$RUNNER_TEMP/upstream" rev-parse HEAD 'HEAD^{tree}'

      - name: Stage the candidate ENGINE-LOCK.json (temp only; the tracked lock is untouched here)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-lock"
          cp "$ENGINE_DIR/ENGINE-LOCK.json" "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json"
          python3 "$ENGINE_DIR/workflows/tools/update_lock.py" \
            --lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --commit "$CANDIDATE_COMMIT" \
            --engine-version "$CANDIDATE_VERSION" \
            --source "$RUNNER_TEMP/upstream"

      - name: Stage the candidate engine tree (temp only; the tracked lock, contract and binary stay untouched)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          # The tracked build tool resolves ENGINE-LOCK.json/adapter/patches/
          # contract module-relative to itself, so a changed candidate must be
          # built from a staged copy carrying the candidate lock; the tracked
          # tree is read-only here.
          # $RUNNER_TEMP/logs is the shared log directory for every later
          # build/gate receipt, and the tee below is the first write into it:
          # on a fresh runner the directory does not exist yet, so tee failed
          # the whole pipefail pipeline even though staging itself succeeded
          # (scheduled run 40462256034). Create it before the first log write;
          # pipefail stays untouched, so a real staging failure still fails
          # the step.
          mkdir -p "$RUNNER_TEMP/logs"
          python3 "$ENGINE_DIR/workflows/tools/stage_candidate_engine.py" \
            --engine-dir "$ENGINE_DIR" \
            --candidate-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --out "$RUNNER_TEMP/candidate-engine/hub" \
            | tee "$RUNNER_TEMP/logs/stage-candidate-engine.json"

      - name: Preflight the tracked patches against the candidate
        run: |
          set -euo pipefail
          # A patch that no longer applies must fail the run, not build unpatched.
          # --allow-network: a fresh runner has an empty Cargo registry, and the
          # dependency audit needs the registry to resolve the graph. The audit
          # itself always runs (never --skip-dependency-audit).
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$RUST_TARGET" --profile release \
            --cargo-target-dir "$RUNNER_TEMP/target" \
            --build-dir "$RUNNER_TEMP/build" \
            --log-dir "$RUNNER_TEMP/logs" \
            --zig-python "$RUNNER_TEMP/zigenv/bin/python" \
            --jobs 6 --skip-build --allow-network

      - name: Build the riscv64 engine from the pinned source
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$RUST_TARGET" --profile release \
            --cargo-target-dir "$RUNNER_TEMP/target" \
            --build-dir "$RUNNER_TEMP/build" \
            --log-dir "$RUNNER_TEMP/logs" \
            --zig-python "$RUNNER_TEMP/zigenv/bin/python" \
            --jobs 6 --dist "$RUNNER_TEMP/dist" --allow-network

      - name: Build the host engine and run the adapter suite
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$(rustc -vV | sed -n 's|host: ||p')" --profile dev \
            --cargo-target-dir "$RUNNER_TEMP/target-host" \
            --build-dir "$RUNNER_TEMP/build-host" \
            --log-dir "$RUNNER_TEMP/logs" --jobs 6 --tests --allow-network

      - name: Contract coherence gate
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/contract/tools/validate_fixtures.py" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --upstream "$RUNNER_TEMP/upstream" \
            > "$RUNNER_TEMP/logs/contract-validation.json"

      - name: Behaviour matrix on riscv64 (emulated)
        run: |
          set -euo pipefail
          ENGINE="$(find "$RUNNER_TEMP/dist" -name floe-impeccable -type f | head -1)"
          python3 "$ENGINE_DIR/build/verify_engine_run.py" \
            --binary "$ENGINE" --build-tree "$RUNNER_TEMP/build" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --stage "$RUNNER_TEMP/stage-riscv64" \
            --out "$RUNNER_TEMP/logs/verify-riscv64.json" \
            --docker-platform linux/riscv64 --parity-limit 12

      - name: Behaviour matrix on the host build
        run: |
          set -euo pipefail
          HOST_ENGINE="$(find "$RUNNER_TEMP/target-host" -name floe-impeccable -type f -path '*/debug/*' | head -1)"
          python3 "$ENGINE_DIR/build/verify_engine_run.py" \
            --binary "$HOST_ENGINE" --build-tree "$RUNNER_TEMP/build-host" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --stage "$RUNNER_TEMP/stage-host" \
            --out "$RUNNER_TEMP/logs/verify-host.json" --parity-limit 25

      - name: Needs/facts fixpoint regression against the recorded goldens
        run: |
          set -euo pipefail
          ENGINE="$(find "$RUNNER_TEMP/dist" -name floe-impeccable -type f | head -1)"
          # The golden comparison authenticates the candidate result's exact
          # engine identity against the staged candidate lock first; only
          # those four identity keys are excluded from the behavioural diff
          # and recorded as candidateIdentityChanges review evidence.
          python3 "$ENGINE_DIR/workflows/tools/compare_expected.py" \
            --engine "$ENGINE" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --expected "$ENGINE_DIR/contract/expected/riscv64-docker" \
            --out "$RUNNER_TEMP/logs/golden-comparison.json" \
            --candidate-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --build-tree "$RUNNER_TEMP/build" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --docker-platform linux/riscv64

      - name: Regenerate the derived skill source for the candidate (public stage 1 normalizer)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_TREE: ${{ needs.pin.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          # Both the commit and the tree are explicit candidate identity; each
          # consuming step re-asserts the quoted env shape before use.
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          python3 "$ENGINE_DIR/build/skill-source/stage1_normalize_skill_source.py" \
            --upstream "$RUNNER_TEMP/upstream" \
            --out "$RUNNER_TEMP/sources-impeccable" \
            --commit "$CANDIDATE_COMMIT" \
            --tree "$CANDIDATE_TREE" \
            --engine-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json"

      - name: Collect reviewer artifacts (never committed, never published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (verified official tag -> commit)
        with:
          name: impeccable-engine-candidate
          path: |
            ${{ runner.temp }}/dist/**
            ${{ runner.temp }}/logs/*.json
            ${{ runner.temp }}/sources-impeccable/**
            ${{ runner.temp }}/candidate-lock/ENGINE-LOCK.json
          if-no-files-found: error
          retention-days: 14

      - name: Collect gate-failure logs for reviewers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (verified official tag -> commit)
        with:
          name: impeccable-engine-candidate-failure-logs
          path: |
            ${{ runner.temp }}/logs/*.json
          if-no-files-found: ignore
          retention-days: 14

  open-update-pr:
    name: Open the review-only update PR
    needs: [pin, build-and-verify]
    if: needs.pin.outputs.changed == 'true' && vars.FLOE_IMPECCABLE_UPDATE_PRS == 'enabled' && (inputs.open_pr == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - name: Prepare the branch
        id: branch
        env:
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BRANCH="chore/impeccable-engine-$CANDIDATE_VERSION"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"

      - name: Stage the pin and lock update only
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 "$ENGINE_DIR/workflows/tools/update_lock.py" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --commit "$CANDIDATE_COMMIT" \
            --engine-version "$CANDIDATE_VERSION" \
            --upstream-repo pbakaus/impeccable
          git diff --stat

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.pin.outputs.current_engine_version }}
          CURRENT_COMMIT: ${{ needs.pin.outputs.current_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_TAG: ${{ needs.pin.outputs.candidate_tag }}
          DECISION_MODE: ${{ needs.pin.outputs.decision_mode }}
          DECISION_REASON: ${{ needs.pin.outputs.decision_reason }}
        run: |
          set -euo pipefail
          # Every interpolated value below is data passed through env and
          # re-asserted here; nothing reaches the script text as a workflow expression.
          [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CURRENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^engine-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DECISION_MODE" =~ ^(automatic|manual-review)$ ]]
          git add "$ENGINE_DIR/ENGINE-LOCK.json"
          git -c user.name "floe-skill-hub-bot" -c user.email "bot@users.noreply.github.com" \
            commit -m "chore(impeccable): propose engine $CANDIDATE_VERSION" || exit 0
          git push -u origin "$(git rev-parse --abbrev-ref HEAD)"
          {
            echo 'Automated upstream engine check. **Draft: nothing here is published, signed,'
            echo 'merged or installed.**'
            echo ''
            echo "- current pin: \`$CURRENT_VERSION\` @ \`$CURRENT_COMMIT\`"
            echo "- candidate: \`$CANDIDATE_VERSION\` @ \`$CANDIDATE_COMMIT\` (tag \`$CANDIDATE_TAG\`)"
            echo "- decision: \`$DECISION_MODE\` — $DECISION_REASON"
            echo ''
            echo 'Gates that ran on the candidate: pinned-source riscv64 static build'
            echo '(from the staged candidate engine tree) with the dependency audit'
            echo '(no TLS/crypto in the graph), adapter suite on the host, contract'
            echo 'coherence, the behaviour matrix on emulated riscv64 and on the host,'
            echo 'the Needs/facts golden comparison, and a stage 1 regeneration of the'
            echo 'derived skill source against the explicitly staged candidate lock.'
            echo 'See the `impeccable-engine-candidate` artifact for the receipts, the'
            echo 'built binary, the candidate-derived source and the staged lock.'
            echo ''
            echo 'Reviewer checklist before this can move forward:'
            echo ''
            echo '1. read the upstream diff and rebase `patches/0001` if it no longer applies;'
            echo '2. confirm the skill/engine pairing: run the public regeneration'
            echo '   (`sh engines/impeccable/build/skill-source/run_pipeline.sh <clone> <hub> <work>`),'
            echo '   bump the canonical package version deliberately, and adopt `<work>/canonical`'
            echo '   into `sources/impeccable` by hand — never an unreviewed regenerated packet;'
            echo '3. bind the new digest-bound descriptor'
            echo '   (`engines/impeccable/runtime-dependency/descriptor.v1.json`) to the rebuilt'
            echo '   engine artifact;'
            echo '4. review the golden comparison: engine identity changes appear as'
            echo '   `candidateIdentityChanges` evidence; any real finding/coverage change stays'
            echo '   review-blocking until the goldens are re-recorded and explicitly allowed;'
            echo '5. run the engine in the real Floe Linux guest (TinyEMU; emulated execution is'
            echo '   not guest proof), record latency and peak memory, and complete the App-side'
            echo '   acceptance;'
            echo '6. only then let the release owner package, sign and publish. A failed gate'
            echo '   leaves the current pin and any installed engine untouched.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --draft \
            --title "Impeccable engine $CANDIDATE_VERSION (review required)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
