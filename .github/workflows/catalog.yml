name: catalog
# Deterministic content gates only. This workflow never holds signing keys,
# never publishes feeds, packages or releases, and never deploys anything.
on:
  push:
    branches: [main]
    paths:
      - "catalog/**"
      - "schema/**"
      - "scripts/**"
      - "showcase/**"
      - "sources/**"
      - "engines/impeccable/**"
      - "tests/**"
      - "docs/CATALOG-CONTRACT.md"
      - "docs/LEGACY-COMPATIBILITY.md"
      - "docs/UPSTREAM-PINS.json"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/skill-hub-*.yml"
      - ".github/workflows/impeccable-*.yml"
      - "automation/workflows/floe-skill-hub-auto-publication.yml"
  pull_request:
    paths:
      - "catalog/**"
      - "schema/**"
      - "scripts/**"
      - "showcase/**"
      - "sources/**"
      - "engines/impeccable/**"
      - "tests/**"
      - "docs/CATALOG-CONTRACT.md"
      - "docs/LEGACY-COMPATIBILITY.md"
      - "docs/UPSTREAM-PINS.json"
      - ".github/workflows/catalog.yml"
      - ".github/workflows/skill-hub-*.yml"
      - ".github/workflows/impeccable-*.yml"
      - "automation/workflows/floe-skill-hub-auto-publication.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Action refs are pinned to immutable upstream commit SHAs (verified via
      # the public repos' tag->commit mapping), not mutable version tags:
      #   actions/checkout   v4.4.0  -> 11d5960a326750d5838078e36cf38b85af677262
      #   actions/setup-python v5.6.0 -> a26af69be951a213d495a4c3e4e4022e16d87065
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install the pinned signing library (verification only)
        run: python3 -m pip install --disable-pip-version-check cryptography==46.0.6
      - name: Schema documents match the validator
        run: python3 scripts/gen_schemas.py --check
      - name: Upstream update policy covers the curated selection
        run: python3 scripts/upstream_updates.py validate-policy
      - name: Fixture sample rebuilds byte-identically and verifies
        run: python3 scripts/make_fixture.py --check
      - name: Candidate feeds rebuild deterministically (unsigned, scratch output)
        run: python3 scripts/build_catalog.py --mode preview --source-commit "${{ github.sha }}" --out-root .build/catalog
      - name: Staged sources pass the package gates (read-only)
        run: python3 scripts/build_packages.py --check
      - name: Showcase content gates (read-only editorial, media, links audit)
        run: python3 showcase/scripts/validate_showcase.py
      - name: Full integrity gate (pins, published feeds standalone if any, secrets)
        run: python3 scripts/check_catalog.py
      - name: Behaviour tests
        run: python3 -m unittest discover -s tests/catalog -t tests/catalog -v
      - name: Automatic update and platform compatibility tests
        run: python3 -m unittest discover -s tests -t tests -p 'test_*.py' -v
      - name: Incremental publication policy probe (read-only, in-memory)
        run: |
          # Root-approved staged opening (2026-10-27): the launch gate admits
          # the EXACT genuinely qualified, download-eligible set incrementally
          # (the four App-provided builtins are native App features and never
          # Hub download offers) while every per-item trust invariant stays
          # enforced. Here the current signed material must pass the gate
          # as-is; every release offer must carry the FEED-ONLY published=true
          # projection while the raw registry rows stay published=false; a
          # partial drop must still be refused by the exact-set rule; an
          # explicit zero-qualified fixture must always refuse release; and
          # the retired 40/all-nine batch rule may only appear as informational
          # coverage metadata that never claims completeness for a partial
          # feed. Nothing signs or writes.
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          from types import SimpleNamespace
          sys.dont_write_bytecode = True
          sys.path.insert(0, "scripts")
          sys.path.insert(0, "tests/catalog")
          import hubcore, build_catalog, sign_publication, runtime_dependency, catalog_views
          import fixture_status
          root = pathlib.Path(".")
          publication_paths = tuple(sorted(catalog_views.ARTIFACT_FILES))
          def publication_snapshot():
              snapshot = {}
              for relative in publication_paths:
                  path = root / relative
                  if path.is_symlink():
                      raise SystemExit(f"publication path must not be a symlink: {relative}")
                  snapshot[relative] = None if not path.exists() else (
                      path.stat().st_size, path.stat().st_mtime_ns,
                      hashlib.sha256(path.read_bytes()).hexdigest())
              return snapshot
          publication_before = publication_snapshot()
          registry = hubcore.validate_registry(
              json.loads((root / "catalog" / "skills.json").read_bytes()))
          trust = build_catalog.load_trust(root)
          outputs = build_catalog.build(registry, "release", "${{ github.sha }}",
                                        root, root, trust)
          ios = json.loads(outputs["catalog-full.json"])
          android = json.loads(outputs["android/catalog-full.json"])
          expected = {
              channel: {entry["id"] for entry in registry["skills"]
                        if entry["status"]["qualified"]
                        and channel in entry["plannedRuntime"]["installPlatforms"]
                        and not hubcore.is_download_offer_excluded(entry["id"])}
              for channel in ("ios", "android")
          }
          for channel, feed in (("ios", ios), ("android", android)):
              ids = [entry["id"] for entry in feed["entries"]]
              if set(ids) != expected[channel] or len(ids) != len(expected[channel]):
                  raise SystemExit(f"{channel}: release offers must match the qualified "
                                   "download-eligible registry rows")
              if feed["counts"]["total"] != len(ids):
                  raise SystemExit(f"{channel}: release counts disagree with actual offers")
              if not expected[channel]:
                  raise SystemExit(f"{channel}: a zero-qualified release feed is never built")
              if any(entry["id"] in hubcore.APP_PROVIDED_BUILTIN_IDS for entry in feed["entries"]):
                  raise SystemExit(f"{channel}: App-provided builtin ids must never be download offers")
              for entry in feed["entries"]:
                  if not entry["status"]["published"]:
                      raise SystemExit(f"{channel}/{entry['id']}: a release offer must carry "
                                       "the feed-only published=true projection")
          for entry in registry["skills"]:
              if entry["status"]["published"]:
                  raise SystemExit(f"{entry['id']}: the raw registry must stay published=false "
                                   "(publication is a feed-side projection only)")
          args = SimpleNamespace(data=str(root), source_commit="${{ github.sha }}")
          gate = sign_publication.enforce_launch_gate(
              hubcore, runtime_dependency, args, registry, outputs)
          coverage = gate["completeSelectionCoverage"]
          if not coverage["informationalOnly"]:
              raise SystemExit("coverage metadata lost its informationalOnly flag")
          selection_qualified = sum(1 for entry in registry["skills"]
                                    if entry["status"]["qualified"])
          builtin_provided = sum(1 for entry in registry["skills"]
                                 if entry["id"] in hubcore.APP_PROVIDED_BUILTIN_IDS
                                 and entry["status"]["qualified"])
          if coverage["selectionQualified"] != selection_qualified:
              raise SystemExit("coverage selectionQualified disagrees with the registry")
          if coverage["builtinProvided"] != builtin_provided:
              raise SystemExit("coverage builtinProvided disagrees with the registry")
          if coverage["downloadEligible"] != selection_qualified - builtin_provided:
              raise SystemExit("coverage downloadEligible disagrees with its own parts")
          if gate["selectionQualified"] != selection_qualified:
              raise SystemExit("gate selectionQualified disagrees with the registry")
          if gate["builtinProvided"] != builtin_provided:
              raise SystemExit("gate builtinProvided disagrees with the registry")
          if coverage["mandatoryDeepAllPresent"] != (
                  sign_publication.MANDATORY_DEEP_IDS <=
                  (expected["ios"] | expected["android"])):
              raise SystemExit("complete-selection coverage disagrees with the feeds")
          if coverage["complete"] != (coverage["meetsQualifiedTarget"]
                                      and coverage["mandatoryDeepAllPresent"]):
              raise SystemExit("coverage completeness disagrees with its own parts")
          if set(gate["mandatoryDeepOffered"]) != (
                  sign_publication.MANDATORY_DEEP_IDS & (expected["ios"] | expected["android"])):
              raise SystemExit("offered mandatory set disagrees with the registry")
          print(f"incremental launch gate accepted the exact qualified download set: "
                f"iOS {gate['iosQualified']}, Android {gate['androidQualified']}; "
                f"selection {coverage['selectionQualified']}/"
                f"{coverage['qualifiedTarget']} (builtins provided "
                f"{coverage['builtinProvided']}, download-eligible "
                f"{coverage['downloadEligible']}); mandatory deep offered "
                f"{len(gate['mandatoryDeepOffered'])}/"
                f"{coverage['mandatoryDeepTotal']}; complete-selection coverage "
                f"(informational): {coverage['complete']}")
          dropped = json.loads(outputs["catalog-full.json"])
          dropped["entries"] = dropped["entries"][:-1]
          try:
              sign_publication.enforce_launch_gate(
                  hubcore, runtime_dependency, args, registry,
                  dict(outputs, **{"catalog-full.json": hubcore.encoded(dropped),
                                   "catalog.json": hubcore.encoded(
                                       build_catalog.project_legacy_catalog(registry, dropped))}))
          except sign_publication.SigningError as error:
              if "exactly the qualified rows advertising iOS" not in str(error):
                  raise SystemExit(f"partial-drop refusal changed: {error}")
              print(f"partial-dropped iOS feed still refused: {error}")
          else:
              raise SystemExit("a partial-dropped iOS feed must be refused")
          stripped = fixture_status.stage_unadmitted_fixture(registry)
          try:
              build_catalog.build(stripped, "release", "${{ github.sha }}",
                                  root, root, trust)
          except hubcore.HubError as error:
              reason = str(error)
              if "refuses to emit an empty catalog" not in reason:
                  raise SystemExit(f"empty-catalog refusal changed: {reason}")
              print(f"explicit zero-qualified fixture still fails closed: {reason}")
          else:
              raise SystemExit("a zero-qualified fixture registry must never build "
                               "a release catalog")
          # A published repository already contains these files. The probe
          # must preserve their presence, bytes and write timestamps exactly.
          if publication_snapshot() != publication_before:
              raise SystemExit("probe changed live publication paths")
          print("read-only probe preserved existing publication paths")
          PY
      - name: Clean up regenerable build output
        if: always()
        run: rm -rf .build
