# TEMPLATE — not installed. H1 owns `.github/workflows/` at the repository root.
#
# Install as `.github/workflows/impeccable-engine-updater.yml` after review.
#
# What it does: once a day (and on demand) it compares the upstream Impeccable
# engine release with the pin in `engines/impeccable/ENGINE-LOCK.json`. When a
# strictly newer stable engine release exists, it rebuilds the engine from
# that candidate commit inside a staged temp engine tree (the tracked lock,
# contract and binary stay untouched), runs the adapter suite, the contract
# gate, the behaviour matrix on the host and on riscv64, and the Needs/facts
# fixpoint regression, regenerates the derived skill source with the public
# stage 1 normalizer against an explicitly staged candidate lock, then opens
# a **draft update PR**. Nothing is published, signed, merged or installed.
#
# Update policy (automatic path): only non-draft, non-prerelease
# `engine-v<semver>` release tags are considered, the tag must agree with the
# `ENGINE_VERSION` in its own tree, and `changed` is true only for a strictly
# newer semantic engine version than the pin. A same-version release tag
# retargeted at a different commit (or an older version) is reported as
# unchanged with the reason recorded in the step summary: the pin is retained
# and nothing is rebuilt. A manually dispatched ref may stage an intentional
# different-commit/same-version candidate for review only (`manual-review`),
# never an automatic install.
#
# Deliberate limits:
#   * no signing secrets and no release credentials: only the default
#     `GITHUB_TOKEN`; the pin/build jobs are `contents: read`, and only the PR
#     job gets `contents`/`pull-requests` write, never approval or merge;
#   * the binary is uploaded as a workflow artifact for reviewers, never
#     committed and never attached to a release — packaging and publication stay
#     with the release owner;
#   * a failing gate leaves the current pin untouched: the PR is opened only
#     after every gate passed, and an existing installed engine is never
#     replaced automatically;
#   * it follows upstream **stable release tags** (`engine-v*`), never upstream
#     `main`, never drafts or prereleases, and never proposes a same-version or
#     downgrade update automatically;
#   * the tracked `ENGINE-LOCK.json`, the frozen contract, the frozen binary
#     and `sources/impeccable` are never modified by the workflow: the candidate
#     builds from a staged temp engine tree carrying the candidate lock, and
#     real compile/audit steps run with `--allow-network` on the fresh runner
#     (the no-TLS/no-crypto dependency audit always runs).
#
# Input and supply-chain handling (post-review hardening):
#   * every upstream-controlled value (`ENGINE_VERSION`, resolved commits,
#     candidate tags, the dispatch `upstream_ref`) is shape-validated in
#     `tools/resolve_upstream_pin.py` before emission, re-checked at the
#     `$GITHUB_OUTPUT` boundary, and re-asserted in each consuming step;
#   * workflow step outputs are passed to `run:` blocks only through `env:`
#     mappings and quoted `"$VARS"` argv — never as `${{ … }}` expressions
#     inside shell text;
#   * third-party actions are pinned to full commit SHAs (verified against the
#     action repositories' own refs; see `workflows/README.md`), not floating
#     major tags.

name: impeccable-engine-updater

on:
  schedule:
    # 06:10 UTC daily, offset from the other hub jobs
    - cron: "10 6 * * *"
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Candidate upstream commit or engine-v* tag (empty = latest release tag)"
        required: false
        default: ""
      open_pr:
        description: "Open the update PR when every gate passes"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]

permissions:
  # Least privilege: everything reads by default; only the PR job gets the
  # write scopes, on the default token only. The repository default workflow
  # permission stays `read`. Automatic draft PR creation also requires the
  # owner-approved combined create/approve repository switch; while it is
  # disabled, checks/builds can run but the PR job cannot create a PR. This
  # workflow never changes that setting, approves, merges or publishes.
  contents: read

concurrency:
  group: impeccable-engine-updater
  cancel-in-progress: false

env:
  RUST_TOOLCHAIN: "1.98.1"
  RUST_TARGET: riscv64gc-unknown-linux-musl
  ZIG_VERSION: "0.17.0"
  ENGINE_DIR: engines/impeccable
  SOURCE_DIR: sources/impeccable

jobs:
  pin:
    name: Compare the pin with the upstream engine release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      decision_mode: ${{ steps.compare.outputs.decision_mode }}
      decision_reason: ${{ steps.compare.outputs.decision_reason }}
      current_commit: ${{ steps.compare.outputs.current_commit }}
      current_engine_version: ${{ steps.compare.outputs.current_engine_version }}
      candidate_commit: ${{ steps.compare.outputs.candidate_commit }}
      candidate_tree: ${{ steps.compare.outputs.candidate_tree }}
      candidate_engine_version: ${{ steps.compare.outputs.candidate_engine_version }}
      candidate_tag: ${{ steps.compare.outputs.candidate_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - id: compare
        name: Resolve the candidate and compare it with ENGINE-LOCK.json
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/workflows/tools/resolve_upstream_pin.py" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --upstream-repo pbakaus/impeccable \
            --requested-ref "${UPSTREAM_REF:-}" \
            --out "$RUNNER_TEMP/pin.json"
          cat "$RUNNER_TEMP/pin.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          pin = json.load(open(os.environ["RUNNER_TEMP"] + "/pin.json"))
          # Defense in depth: resolve_upstream_pin.py already shape-checked
          # these, but nothing unvalidated may cross the $GITHUB_OUTPUT
          # boundary. changed is coerced to the literal true/false below.
          SHAPES = {
              "current_commit": r"[0-9a-f]{40}",
              "candidate_commit": r"[0-9a-f]{40}",
              "candidate_tree": r"[0-9a-f]{40}",
              "current_engine_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "candidate_engine_version": r"[0-9]+\.[0-9]+\.[0-9]+",
              "candidate_tag": r"engine-v[0-9]+\.[0-9]+\.[0-9]+",
              "decision_mode": r"automatic|manual-review|no-op",
              # single-line printable ASCII, bounded length: safe in a
              # summary line and in the PR body.
              "decision_reason": r"[ -~]{1,240}",
          }
          for key, shape in SHAPES.items():
              value = pin.get(key)
              if not isinstance(value, str) or not re.fullmatch(shape, value):
                  sys.exit(f"refusing to emit output {key!r}: {value!r} does not match {shape}")
          print(f"changed={str(pin['changed']).lower()}")
          for key in SHAPES:
              print(f"{key}={pin[key]}")
          PY

      - name: Record the decision
        env:
          CHANGED: ${{ steps.compare.outputs.changed }}
          DECISION_MODE: ${{ steps.compare.outputs.decision_mode }}
          DECISION_REASON: ${{ steps.compare.outputs.decision_reason }}
          CURRENT_VERSION: ${{ steps.compare.outputs.current_engine_version }}
          CURRENT_COMMIT: ${{ steps.compare.outputs.current_commit }}
          CANDIDATE_VERSION: ${{ steps.compare.outputs.candidate_engine_version }}
          CANDIDATE_COMMIT: ${{ steps.compare.outputs.candidate_commit }}
          CANDIDATE_TAG: ${{ steps.compare.outputs.candidate_tag }}
        run: |
          {
            echo "### Impeccable engine pin check"
            echo ""
            echo "- current: \`$CURRENT_VERSION\` @ \`$CURRENT_COMMIT\`"
            echo "- candidate: \`$CANDIDATE_VERSION\` @ \`$CANDIDATE_COMMIT\` (tag \`$CANDIDATE_TAG\`)"
            echo "- changed: \`$CHANGED\`"
            echo "- decision: \`$DECISION_MODE\` — $DECISION_REASON"
          } >> "$GITHUB_STEP_SUMMARY"

  build-and-verify:
    name: Build and verify the candidate engine
    needs: pin
    if: needs.pin.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    # raised from 90: the published-baseline route re-executes that baseline
    # (pinned worktree plus a third emulated-riscv64 behaviour matrix) and
    # runs the candidate-versus-baseline regression in the same hosted
    # matrix; the historical route adds only the digest/identity routing steps
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - name: Install the pinned Rust toolchain and target
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup target add --toolchain "$RUST_TOOLCHAIN" "$RUST_TARGET"
          rustup default "$RUST_TOOLCHAIN"

      - name: Install the pinned zig cross toolchain
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/zigenv"
          "$RUNNER_TEMP/zigenv/bin/pip" install --quiet "ziglang==$ZIG_VERSION"
          "$RUNNER_TEMP/zigenv/bin/python" -m ziglang version

      - name: Register a riscv64 binfmt handler (emulated behaviour matrix)
        run: docker run --privileged --rm tonistiigi/binfmt --install riscv64

      - name: Fetch the pinned upstream source at the candidate commit
        env:
          CANDIDATE: ${{ needs.pin.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          # Re-assert the shape here; the value is data, never script text.
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git clone --filter=blob:none https://github.com/pbakaus/impeccable.git "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" checkout "$CANDIDATE"
          git -C "$RUNNER_TEMP/upstream" rev-parse HEAD 'HEAD^{tree}'

      - name: Stage the candidate ENGINE-LOCK.json (temp only; the tracked lock is untouched here)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/candidate-lock"
          cp "$ENGINE_DIR/ENGINE-LOCK.json" "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json"
          python3 "$ENGINE_DIR/workflows/tools/update_lock.py" \
            --lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --commit "$CANDIDATE_COMMIT" \
            --engine-version "$CANDIDATE_VERSION" \
            --source "$RUNNER_TEMP/upstream"

      - name: Stage the candidate engine tree (temp only; the tracked lock, contract and binary stay untouched)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          # The tracked build tool resolves ENGINE-LOCK.json/adapter/patches/
          # contract module-relative to itself, so a changed candidate must be
          # built from a staged copy carrying the candidate lock; the tracked
          # tree is read-only here.
          # $RUNNER_TEMP/logs is the shared log directory for every later
          # build/gate receipt, and the tee below is the first write into it:
          # on a fresh runner the directory does not exist yet, so tee failed
          # the whole pipefail pipeline even though staging itself succeeded
          # (scheduled run 40462256034). Create it before the first log write;
          # pipefail stays untouched, so a real staging failure still fails
          # the step.
          mkdir -p "$RUNNER_TEMP/logs"
          python3 "$ENGINE_DIR/workflows/tools/stage_candidate_engine.py" \
            --engine-dir "$ENGINE_DIR" \
            --candidate-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --out "$RUNNER_TEMP/candidate-engine/hub" \
            | tee "$RUNNER_TEMP/logs/stage-candidate-engine.json"

      - name: Preflight the tracked patches against the candidate
        run: |
          set -euo pipefail
          # A patch that no longer applies must fail the run, not build unpatched.
          # --allow-network: a fresh runner has an empty Cargo registry, and the
          # dependency audit needs the registry to resolve the graph. The audit
          # itself always runs (never --skip-dependency-audit).
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$RUST_TARGET" --profile release \
            --cargo-target-dir "$RUNNER_TEMP/target" \
            --build-dir "$RUNNER_TEMP/build" \
            --log-dir "$RUNNER_TEMP/logs" \
            --zig-python "$RUNNER_TEMP/zigenv/bin/python" \
            --jobs 6 --skip-build --allow-network

      - name: Build the riscv64 engine from the pinned source
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$RUST_TARGET" --profile release \
            --cargo-target-dir "$RUNNER_TEMP/target" \
            --build-dir "$RUNNER_TEMP/build" \
            --log-dir "$RUNNER_TEMP/logs" \
            --zig-python "$RUNNER_TEMP/zigenv/bin/python" \
            --jobs 6 --dist "$RUNNER_TEMP/dist" --allow-network

      - name: Build the host engine and run the adapter suite
        run: |
          set -euo pipefail
          python3 "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/build/build_engine.py" \
            --source "$RUNNER_TEMP/upstream" \
            --target "$(rustc -vV | sed -n 's|host: ||p')" --profile dev \
            --cargo-target-dir "$RUNNER_TEMP/target-host" \
            --build-dir "$RUNNER_TEMP/build-host" \
            --log-dir "$RUNNER_TEMP/logs" --jobs 6 --tests --allow-network

      - name: Contract coherence gate
        run: |
          set -euo pipefail
          python3 "$ENGINE_DIR/contract/tools/validate_fixtures.py" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --upstream "$RUNNER_TEMP/upstream" \
            > "$RUNNER_TEMP/logs/contract-validation.json"

      - name: Behaviour matrix on riscv64 (emulated)
        run: |
          set -euo pipefail
          ENGINE="$(find "$RUNNER_TEMP/dist" -name floe-impeccable -type f | head -1)"
          python3 "$ENGINE_DIR/build/verify_engine_run.py" \
            --binary "$ENGINE" --build-tree "$RUNNER_TEMP/build" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --stage "$RUNNER_TEMP/stage-riscv64" \
            --out "$RUNNER_TEMP/logs/verify-riscv64.json" \
            --docker-platform linux/riscv64 --parity-limit 12

      - name: Behaviour matrix on the host build
        run: |
          set -euo pipefail
          HOST_ENGINE="$(find "$RUNNER_TEMP/target-host" -name floe-impeccable -type f -path '*/debug/*' | head -1)"
          python3 "$ENGINE_DIR/build/verify_engine_run.py" \
            --binary "$HOST_ENGINE" --build-tree "$RUNNER_TEMP/build-host" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --stage "$RUNNER_TEMP/stage-host" \
            --out "$RUNNER_TEMP/logs/verify-host.json" --parity-limit 25

      - name: Verify the published baseline binary against the official lock
        id: baseline
        run: |
          set -euo pipefail
          # The comparison baseline is the already-qualified PUBLISHED engine,
          # never the candidate's own output: the tracked dist artifact for the
          # tracked lock identity must exist, its sha256/size must equal the
          # lock's component digests, every SHA256SUMS.txt entry must verify,
          # and the tracked contract must carry the same canonical identity
          # before any baseline result is ever trusted.
          python3 "$ENGINE_DIR/workflows/tools/verify_published_baseline.py" --verify-binary \
            --engine-dir "$ENGINE_DIR" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --out "$RUNNER_TEMP/logs/baseline-binary-verify.json"
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, sys
          receipt = json.load(open(os.environ["RUNNER_TEMP"] + "/logs/baseline-binary-verify.json"))
          if not receipt.get("ok"):
              sys.exit("the baseline binary receipt is not ok")
          SHAPES = {
              "engine_id": r"impeccable-[0-9]+\.[0-9]+\.[0-9]+\+floe\.[0-9]+\.[0-9]+\.[0-9]+",
              "upstream_commit": r"[0-9a-f]{40}",
              "upstream_tree": r"[0-9a-f]{40}",
              "upstream_engine_version": r"[0-9]+\.[0-9]+\.[0-9]+",
          }
          VALUES = {
              "engine_id": receipt["engineId"],
              "upstream_commit": receipt["upstream"]["commit"],
              "upstream_tree": receipt["upstream"]["tree"],
              "upstream_engine_version": receipt["upstream"]["engineVersion"],
          }
          for key, shape in SHAPES.items():
              value = VALUES[key]
              if not isinstance(value, str) or not re.fullmatch(shape, value):
                  sys.exit(f"refusing to emit output {key!r}: {value!r} does not match {shape}")
          for key in SHAPES:
              print(f"{key}={VALUES[key]}")
          PY

      - name: Route the Needs/facts comparison by authenticated baseline identity
        id: route
        run: |
          set -euo pipefail
          # Exactly one STRICT comparison runs below, selected by the identity
          # of the digest-bound published baseline authenticated immediately
          # above (the receipt is re-bound to the tracked lock again here, so a
          # stale or forged receipt can never steer the route). The frozen
          # committed goldens are the historical reference
          # only when their recorded binary digest AND every recorded engine
          # identity field equal that authenticated baseline; any mismatch
          # routes to the fully verified published-baseline re-run, never to a
          # skipped comparison, and a malformed or tampered frozen tree fails
          # closed here instead of being routed around.
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import hashlib, json, os, re, sys
          from pathlib import Path

          def refuse(message):
              print(f"refusing to route the Needs/facts comparison: {message}", file=sys.stderr)
              sys.exit(2)

          def load_json(path, what):
              try:
                  return json.loads(Path(path).read_text(encoding="utf-8"))
              except (OSError, UnicodeDecodeError, json.JSONDecodeError) as exc:
                  refuse(f"{what} is unusable: {exc}")

          runner_temp = Path(os.environ["RUNNER_TEMP"])
          engine_dir = Path(os.environ["ENGINE_DIR"])
          receipt = load_json(runner_temp / "logs" / "baseline-binary-verify.json",
                              "the baseline binary receipt")
          if not isinstance(receipt, dict) or receipt.get("ok") is not True \
                  or receipt.get("mode") != "verify-binary":
              refuse("the baseline binary receipt is not a successful binary verification")
          engine_id = receipt.get("engineId")
          if not isinstance(engine_id, str) or not re.fullmatch(
                  r"impeccable-[0-9]+\.[0-9]+\.[0-9]+\+floe\.[0-9]+\.[0-9]+\.[0-9]+", engine_id):
              refuse(f"the receipt engineId is not the canonical component identity: {engine_id!r}")
          binary_sha = receipt.get("sha256")
          if not isinstance(binary_sha, str) or not re.fullmatch(r"[0-9a-f]{64}", binary_sha):
              refuse(f"the receipt binary sha256 is not 64-hex: {binary_sha!r}")
          adapter = receipt.get("adapterVersion")
          if not isinstance(adapter, str) or not re.fullmatch(
                  r"[0-9]+\.[0-9]+\.[0-9]+", adapter):
              refuse(f"the receipt adapterVersion is not dotted-semver: {adapter!r}")
          upstream = receipt.get("upstream")
          if not isinstance(upstream, dict):
              refuse("the receipt carries no upstream pin block")
          for key in ("commit", "tree"):
              if not isinstance(upstream.get(key), str) or not re.fullmatch(
                      r"[0-9a-f]{40}", upstream[key]):
                  refuse(f"the receipt upstream.{key} is not a 40-hex sha: {upstream.get(key)!r}")
          version = upstream.get("engineVersion")
          if not isinstance(version, str) or not re.fullmatch(
                  r"[0-9]+\.[0-9]+\.[0-9]+", version):
              refuse(f"the receipt upstream.engineVersion is not dotted-semver: {version!r}")

          lock = load_json(engine_dir / "ENGINE-LOCK.json", "the tracked ENGINE-LOCK.json")
          if not isinstance(lock, dict):
              refuse("the tracked ENGINE-LOCK.json is not a JSON object")
          lock_upstream = lock.get("upstream") if isinstance(lock.get("upstream"), dict) else {}
          lock_floe = lock.get("floe") if isinstance(lock.get("floe"), dict) else {}
          lock_component = lock.get("component") if isinstance(lock.get("component"), dict) else {}
          agreement = {
              "engineId": lock.get("engineId"),
              "adapterVersion": lock_floe.get("adapterVersion"),
              "sha256": lock_component.get("artifactSha256"),
              "upstream.commit": lock_upstream.get("commit"),
              "upstream.tree": lock_upstream.get("tree"),
              "upstream.engineVersion": lock_upstream.get("engineVersion"),
          }
          authenticated = {
              "engineId": engine_id,
              "adapterVersion": adapter,
              "sha256": binary_sha,
              "upstream.commit": upstream["commit"],
              "upstream.tree": upstream["tree"],
              "upstream.engineVersion": version,
          }
          for field, expected in agreement.items():
              if authenticated[field] != expected:
                  refuse(f"the binary receipt disagrees with the tracked lock on {field}: "
                         f"{authenticated[field]!r} != {expected!r}")

          goldens = engine_dir / "contract" / "expected" / "riscv64-docker"
          manifest = load_json(goldens / "MANIFEST.json",
                               "the committed riscv64-docker goldens MANIFEST")
          if not isinstance(manifest, dict) or manifest.get("kind") != "engine-observed goldens":
              refuse("the committed goldens MANIFEST has an unexpected kind")
          cases = manifest.get("cases")
          if not isinstance(cases, dict) or not cases:
              refuse("the committed goldens MANIFEST carries no cases")
          golden_sha = manifest.get("engine")
          golden_sha = golden_sha.get("sha256") if isinstance(golden_sha, dict) else None
          if not isinstance(golden_sha, str) or not re.fullmatch(r"[0-9a-f]{64}", golden_sha):
              refuse(f"the committed goldens engine.sha256 is not 64-hex: {golden_sha!r}")

          want = {
              "engineId": engine_id,
              "floeAdapterVersion": adapter,
              "adapterCrateVersion": adapter,
              "upstreamCommit": upstream["commit"],
              "upstreamTree": upstream["tree"],
              "upstreamEngineVersion": version,
          }
          problems = []
          for case, entry in sorted(cases.items()):
              entry = entry if isinstance(entry, dict) else {}
              name = entry.get("file")
              if not isinstance(name, str) or not name:
                  refuse(f"case {case}: the committed MANIFEST names no result file")
              try:
                  raw = (goldens / name).read_bytes()
              except OSError as exc:
                  refuse(f"case {case}: the committed result file is unreadable: {exc}")
              if entry.get("sha256") != hashlib.sha256(raw).hexdigest():
                  refuse(f"case {case}: the committed result file drifted from the MANIFEST digest")
              doc = load_json(goldens / name, f"case {case}: the committed result file")
              observed = doc.get("engine") if isinstance(doc, dict) else None
              observed = observed if isinstance(observed, dict) else {}
              for field, expected in want.items():
                  if observed.get(field) != expected:
                      problems.append(f"case {case}: engine.{field} is "
                                      f"{observed.get(field)!r}, not the authenticated "
                                      f"baseline {expected!r}")
          if golden_sha == binary_sha and not problems:
              route = "historical"
              reason = ("the committed goldens digest and every recorded engine identity "
                        "equal the digest-bound published baseline")
          else:
              route = "published"
              if golden_sha != binary_sha:
                  reason = ("the committed goldens record a different binary digest than the "
                            "digest-bound published baseline")
              elif problems:
                  reason = problems[0]
              else:
                  reason = "the committed identity differs from the digest-bound published baseline"
          if not re.fullmatch(r"historical|published", route):
              refuse(f"derived route {route!r} is not one of historical|published")
          if not re.fullmatch(r"[ -~]{1,240}", reason):
              reason = "the committed identity differs from the digest-bound published baseline"
          print(f"baseline_route={route}")
          print(f"baseline_route_reason={reason}")
          print(f"authenticated published baseline digest: {binary_sha}", file=sys.stderr)
          print(f"committed goldens digest: {golden_sha}", file=sys.stderr)
          PY

      - name: Record the Needs/facts comparison route
        env:
          BASELINE_ROUTE: ${{ steps.route.outputs.baseline_route }}
          BASELINE_ROUTE_REASON: ${{ steps.route.outputs.baseline_route_reason }}
        run: |
          set -euo pipefail
          # Re-assert the emitted route at its consumer boundary: exactly one
          # of the two strict comparators below is selected by this value.
          [[ "$BASELINE_ROUTE" =~ ^(historical|published)$ ]] || exit 2
          {
            echo '### Impeccable Needs/facts comparison route'
            echo ''
            echo "- route: \`$BASELINE_ROUTE\`"
            echo "- reason: $BASELINE_ROUTE_REASON"
            if [ "$BASELINE_ROUTE" = "historical" ]; then
              echo '- reference: the frozen committed goldens (their recorded identity equals the digest-bound published baseline)'
            else
              echo '- reference: a temp record re-run from the digest-bound published baseline (the committed goldens hold a different identity)'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the baseline's own pinned tree (temp worktree of the existing clone)
        if: steps.route.outputs.baseline_route == 'published'
        env:
          BASELINE_COMMIT: ${{ steps.baseline.outputs.upstream_commit }}
          BASELINE_TREE: ${{ steps.baseline.outputs.upstream_tree }}
        run: |
          set -euo pipefail
          # The baseline matrix reads the upstream antipattern fixtures and
          # oracle goldens, so the published engine is measured against its
          # OWN pin, not the candidate's tree. Values arrive only through env
          # mappings and are re-asserted here; nothing reaches shell text.
          [[ "$BASELINE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BASELINE_TREE" =~ ^[0-9a-f]{40}$ ]]
          git -C "$RUNNER_TEMP/upstream" worktree add --detach "$RUNNER_TEMP/upstream-baseline" "$BASELINE_COMMIT"
          [[ "$(git -C "$RUNNER_TEMP/upstream-baseline" rev-parse HEAD)" == "$BASELINE_COMMIT" ]]
          [[ "$(git -C "$RUNNER_TEMP/upstream-baseline" rev-parse 'HEAD^{tree}')" == "$BASELINE_TREE" ]]

      - name: Behaviour matrix on the published baseline (emulated riscv64)
        if: steps.route.outputs.baseline_route == 'published'
        env:
          BASELINE_ENGINE_ID: ${{ steps.baseline.outputs.engine_id }}
        run: |
          set -euo pipefail
          # The digest-bound published binary re-runs the same behaviour matrix
          # in the same hosted emulated-riscv64 environment as the candidate,
          # authenticated against the tracked published contract. The fixed
          # verifier derives the required probe handshake and --version from
          # that contract itself, so no stale literal gates either engine.
          [[ "$BASELINE_ENGINE_ID" =~ ^impeccable-[0-9]+\.[0-9]+\.[0-9]+\+floe\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 "$ENGINE_DIR/build/verify_engine_run.py" \
            --binary "$ENGINE_DIR/dist/$BASELINE_ENGINE_ID/riscv64gc-unknown-linux-musl/floe-impeccable" \
            --build-tree "$RUNNER_TEMP/upstream-baseline" \
            --contract "$ENGINE_DIR/contract" \
            --adapter-data "$ENGINE_DIR/adapter/tests/data" \
            --stage "$RUNNER_TEMP/stage-baseline" \
            --out "$RUNNER_TEMP/logs/verify-baseline.json" \
            --docker-platform linux/riscv64 --parity-limit 12

      - name: Record the versioned baseline results (temp only; never committed, never blessed)
        if: steps.route.outputs.baseline_route == 'published'
        env:
          BASELINE_ENGINE_ID: ${{ steps.baseline.outputs.engine_id }}
        run: |
          set -euo pipefail
          [[ "$BASELINE_ENGINE_ID" =~ ^impeccable-[0-9]+\.[0-9]+\.[0-9]+\+floe\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 "$ENGINE_DIR/build/export_expected.py" \
            --stage "$RUNNER_TEMP/stage-baseline" \
            --label "published-baseline-$BASELINE_ENGINE_ID" \
            --out "$RUNNER_TEMP/expected-baseline/riscv64-docker" \
            --runner "docker linux/riscv64 alpine:3.20 (published baseline re-run)" \
            --evidence "$RUNNER_TEMP/logs/verify-baseline.json"

      - name: Bind the recorded baseline tree to the official lock and binary
        if: steps.route.outputs.baseline_route == 'published'
        run: |
          set -euo pipefail
          # Fail closed unless the record was produced by the digest-verified
          # published binary under a clean emulated-riscv64 behaviour matrix,
          # carries every committed-matrix case, and every case shows exactly
          # the published identity (upstream pin, engineId, floeAdapterVersion
          # AND adapterCrateVersion, target triple and runtime execution).
          # Candidate output can never satisfy this gate; nothing is blessed.
          python3 "$ENGINE_DIR/workflows/tools/verify_published_baseline.py" --verify-record \
            --engine-dir "$ENGINE_DIR" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --receipt "$RUNNER_TEMP/logs/baseline-binary-verify.json" \
            --record "$RUNNER_TEMP/expected-baseline/riscv64-docker" \
            --out "$RUNNER_TEMP/logs/baseline-record-verify.json"

      - name: Needs/facts fixpoint regression against the published baseline
        if: steps.route.outputs.baseline_route == 'published'
        run: |
          set -euo pipefail
          # Selected on the published route (the committed goldens hold a
          # different recorded identity): the primary behavioural gate for a
          # version bump. Baseline and
          # candidate ran the same hosted emulated-riscv64 matrix with the
          # same adapter crate, so adapter-version, ABI, target, coverage,
          # findings and facts fields must all diff byte-exact; only the four
          # engine identity keys (authenticated against the staged candidate
          # lock before anything else) may legitimately move, recorded as
          # candidateIdentityChanges review evidence exactly as before.
          ENGINE="$(find "$RUNNER_TEMP/dist" -name floe-impeccable -type f | head -1)"
          python3 "$ENGINE_DIR/workflows/tools/compare_expected.py" \
            --engine "$ENGINE" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --expected "$RUNNER_TEMP/expected-baseline/riscv64-docker" \
            --out "$RUNNER_TEMP/logs/golden-comparison-vs-baseline.json" \
            --candidate-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --build-tree "$RUNNER_TEMP/build" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --docker-platform linux/riscv64

      - name: Needs/facts fixpoint regression against the recorded goldens
        if: steps.route.outputs.baseline_route == 'historical'
        run: |
          set -euo pipefail
          # Historical review gate against the FROZEN committed goldens. The
          # route above selects it only when those goldens' recorded binary
          # digest and every recorded engine identity equal the digest-bound
          # published baseline, so this strict diff always compares the
          # candidate with the current published engine. A frozen tree that
          # records an older identity (the adapter-1.0.0 era) routes to the
          # verified published-baseline regression instead of failing here on
          # a known identity residual; re-recording those goldens stays a
          # manual review decision taken from the reviewed `expected-baseline`
          # artifact, never an automated blessing and never a relaxation of
          # this comparator.
          ENGINE="$(find "$RUNNER_TEMP/dist" -name floe-impeccable -type f | head -1)"
          # The golden comparison authenticates the candidate result's exact
          # engine identity against the staged candidate lock first; only
          # those four identity keys are excluded from the behavioural diff
          # and recorded as candidateIdentityChanges review evidence.
          python3 "$ENGINE_DIR/workflows/tools/compare_expected.py" \
            --engine "$ENGINE" \
            --contract "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/contract" \
            --expected "$ENGINE_DIR/contract/expected/riscv64-docker" \
            --out "$RUNNER_TEMP/logs/golden-comparison.json" \
            --candidate-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json" \
            --build-tree "$RUNNER_TEMP/build" \
            --adapter-data "$RUNNER_TEMP/candidate-engine/hub/engines/impeccable/adapter/tests/data" \
            --docker-platform linux/riscv64

      - name: Regenerate the derived skill source for the candidate (public stage 1 normalizer)
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_TREE: ${{ needs.pin.outputs.candidate_tree }}
        run: |
          set -euo pipefail
          # Both the commit and the tree are explicit candidate identity; each
          # consuming step re-asserts the quoted env shape before use.
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TREE" =~ ^[0-9a-f]{40}$ ]]
          python3 "$ENGINE_DIR/build/skill-source/stage1_normalize_skill_source.py" \
            --upstream "$RUNNER_TEMP/upstream" \
            --out "$RUNNER_TEMP/sources-impeccable" \
            --commit "$CANDIDATE_COMMIT" \
            --tree "$CANDIDATE_TREE" \
            --engine-lock "$RUNNER_TEMP/candidate-lock/ENGINE-LOCK.json"

      - name: Collect reviewer artifacts (never committed, never published)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (verified official tag -> commit)
        with:
          name: impeccable-engine-candidate
          path: |
            ${{ runner.temp }}/dist/**
            ${{ runner.temp }}/logs/*.json
            ${{ runner.temp }}/sources-impeccable/**
            ${{ runner.temp }}/candidate-lock/ENGINE-LOCK.json
            ${{ runner.temp }}/expected-baseline/**
          if-no-files-found: error
          retention-days: 14

      - name: Collect gate-failure logs for reviewers
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2 (verified official tag -> commit)
        with:
          name: impeccable-engine-candidate-failure-logs
          path: |
            ${{ runner.temp }}/logs/*.json
            ${{ runner.temp }}/expected-baseline/**
          if-no-files-found: ignore
          retention-days: 14

  open-update-pr:
    name: Open the review-only update PR
    needs: [pin, build-and-verify]
    if: needs.pin.outputs.changed == 'true' && vars.FLOE_IMPECCABLE_UPDATE_PRS == 'enabled' && (inputs.open_pr == 'true' || github.event_name == 'schedule')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0 (verified official tag -> commit)

      - name: Prepare the branch
        id: branch
        env:
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          BRANCH="chore/impeccable-engine-$CANDIDATE_VERSION"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -B "$BRANCH"

      - name: Stage the pin and lock update only
        env:
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          python3 "$ENGINE_DIR/workflows/tools/update_lock.py" \
            --lock "$ENGINE_DIR/ENGINE-LOCK.json" \
            --commit "$CANDIDATE_COMMIT" \
            --engine-version "$CANDIDATE_VERSION" \
            --upstream-repo pbakaus/impeccable
          git diff --stat

      - name: Open the PR
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_VERSION: ${{ needs.pin.outputs.current_engine_version }}
          CURRENT_COMMIT: ${{ needs.pin.outputs.current_commit }}
          CANDIDATE_VERSION: ${{ needs.pin.outputs.candidate_engine_version }}
          CANDIDATE_COMMIT: ${{ needs.pin.outputs.candidate_commit }}
          CANDIDATE_TAG: ${{ needs.pin.outputs.candidate_tag }}
          DECISION_MODE: ${{ needs.pin.outputs.decision_mode }}
          DECISION_REASON: ${{ needs.pin.outputs.decision_reason }}
        run: |
          set -euo pipefail
          # Every interpolated value below is data passed through env and
          # re-asserted here; nothing reaches the script text as a workflow expression.
          [[ "$CURRENT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CURRENT_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$CANDIDATE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CANDIDATE_TAG" =~ ^engine-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$DECISION_MODE" =~ ^(automatic|manual-review)$ ]]
          git add "$ENGINE_DIR/ENGINE-LOCK.json"
          git -c user.name "floe-skill-hub-bot" -c user.email "bot@users.noreply.github.com" \
            commit -m "chore(impeccable): propose engine $CANDIDATE_VERSION" || exit 0
          git push -u origin "$(git rev-parse --abbrev-ref HEAD)"
          {
            echo 'Automated upstream engine check. **Draft: nothing here is published, signed,'
            echo 'merged or installed.**'
            echo ''
            echo "- current pin: \`$CURRENT_VERSION\` @ \`$CURRENT_COMMIT\`"
            echo "- candidate: \`$CANDIDATE_VERSION\` @ \`$CANDIDATE_COMMIT\` (tag \`$CANDIDATE_TAG\`)"
            echo "- decision: \`$DECISION_MODE\` — $DECISION_REASON"
            echo ''
            echo 'Gates that ran on the candidate: pinned-source riscv64 static build'
            echo '(from the staged candidate engine tree) with the dependency audit'
            echo '(no TLS/crypto in the graph), adapter suite on the host, contract'
            echo 'coherence, the behaviour matrix on emulated riscv64 and on the host,'
            echo 'one routed Needs/facts fixpoint regression — against the frozen'
            echo 'committed goldens only while their recorded identity equals the'
            echo 'digest-bound published baseline, otherwise against a fresh re-run'
            echo 'of that published baseline — and a stage 1 regeneration of the'
            echo 'derived skill source against the explicitly staged candidate lock.'
            echo 'See the `impeccable-engine-candidate` artifact for the receipts, the'
            echo 'built binary, the candidate-derived source and the staged lock.'
            echo ''
            echo 'Reviewer checklist before this can move forward:'
            echo ''
            echo '1. read the upstream diff and rebase `patches/0001` if it no longer applies;'
            echo '2. confirm the skill/engine pairing: run the public regeneration'
            echo '   (`sh engines/impeccable/build/skill-source/run_pipeline.sh <clone> <hub> <work>`),'
            echo '   bump the canonical package version deliberately, and adopt `<work>/canonical`'
            echo '   into `sources/impeccable` by hand — never an unreviewed regenerated packet;'
            echo '3. bind the new digest-bound descriptor'
            echo '   (`engines/impeccable/runtime-dependency/descriptor.v1.json`) to the rebuilt'
            echo '   engine artifact;'
            echo '4. review the routed Needs/facts comparison (the step summary names'
            echo '   the route and its reason): engine identity changes appear as'
            echo '   `candidateIdentityChanges` evidence and any real finding/coverage'
            echo '   change stays review-blocking. On the `published` route the frozen'
            echo '   committed goldens were not the reference because their recorded'
            echo '   identity differs from the digest-bound published binary; re-record'
            echo '   them from the reviewed `expected-baseline` artifact as a Root-owned'
            echo '   review decision to move future runs back to the historical gate —'
            echo '   never an automated blessing;'
            echo '5. run the engine in the real Floe Linux guest (TinyEMU; emulated execution is'
            echo '   not guest proof), record latency and peak memory, and complete the App-side'
            echo '   acceptance;'
            echo '6. only then let the release owner package, sign and publish. A failed gate'
            echo '   leaves the current pin and any installed engine untouched.'
          } > "$RUNNER_TEMP/pr-body.md"
          gh pr create --draft \
            --title "Impeccable engine $CANDIDATE_VERSION (review required)" \
            --body-file "$RUNNER_TEMP/pr-body.md"
